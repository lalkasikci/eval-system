notice('<strong>Temel ayrım:</strong> Gold beklentiler yalnızca değerlendirme tarafındadır. Öneri motoru bunları görmez; Claude da bu akışta öneri üretmek yerine mevcut öneriyi rubriğe göre inceler.')+
notice(`<strong>Gerçek bağlantı durumu:</strong> Adapter ${state.integration?.adapter_ready?'hazır':'bulunamadı'}; MADSET_ADVISE_ENDPOINT ${state.integration?.endpoint_configured?'tanımlı':'tanımlı değil'}; gerçek müşteri verisi ${state.integration?.real_data_connected?'bağlı':'bağlı değil'}. Backend verilmeden üretim önerisi veya Meta aksiyonu çalıştırılmaz.`)+
`<div class="workflow">${steps.map(s=>`<article class="workflow-step"><div class="step-no">${s[0]}</div><div class="step-content"><h3>${s[1]}</h3><p>${s[2]}</p></div><div class="step-meta">${s[3].map(x=>{const parts=x.split(':');return `<span class="step-badge ${parts.length>1?parts[0]:''}">${esc(parts.length>1?parts[1]:x)}</span>`}).join('')}</div></article>`).join('')}</div>`+
`<div class="workflow-legend"><span><i class="status-dot"></i> Uygulanan adım</span><span><i class="dot"></i> Koruma veya insan onayı</span></div><p class="footer-info">Gerçek Madset backend ve müşteri verisi bağlandığında yalnızca 02. adımın adapter’ı değişir; değerlendirme sözleşmesi ve izlenebilirlik akışı aynı kalır.</p>`;}
function render(){const renderers={advice:renderAdvice,catalog:renderCatalog,eval:renderEval,scenarios:renderScenarios,rubric:renderRubric,workflow:renderWorkflow};document.getElementById('content').innerHTML=(renderers[state.view]||renderAdvice)();updateNav();}
function routeFor(c,a){if(!a.route)return '';return a.route.replace('<grup>',encodeURIComponent(c.groupId||'ornek-grup-101')).replace('<kreatif>',encodeURIComponent(c.creativeId||'ornek-kreatif-208'));}
function modal(title,body,buttons){const container=document.getElementById('modal-root');container.innerHTML=`<div class="modal-overlay" data-outside="true"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="close" aria-label="Kapat" data-act="close">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${buttons}</div></div></div>`;container.querySelector('.close').focus();}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function toast(text){const x=document.getElementById('toast-root');x.innerHTML=`<div class="toast">${esc(text)}</div>`;setTimeout(()=>{if(x.textContent===text)x.innerHTML=''},3500);}
function showBudget(c){const current=state.budgets[c.finding]; const proposed=Math.round(current*1.10*100)/100;modal('Bütçe artışını onayla',`<p class="modal-desc">Bu işlem gerçek Madset'te Meta hesabına yazılmadan önce onaylanır. Buradaki onay <strong>yalnızca bir simülasyondur</strong>.</p><div class="amounts"><div class="amount"><label>Mevcut günlük bütçe</label><strong>${trMoney(current)}</strong></div><div style="text-align:center;font-size:24px;color:#7D8B7D">→</div><div class="amount proposed"><label>Önerilen (+%10)</label><strong>${trMoney(proposed)}</strong></div></div><div class="status-lines"><div class="state"><small>Bütçenin sahibi</small><strong>${c.budgetOwner==='campaign'?'Kampanya':'Reklam seti'}</strong></div><div class="state"><small>Veri koşulu</small><strong>${state.gate[c.finding]?'Uygun (örnek)':'Kapalı'}</strong></div></div><p class="small-muted" style="margin-top:18px">Gerçek uygulamada yazma sonrası Meta API readback zorunlu; bu ekranda yapılmaz.</p>`,`<button class="outline" data-act="close">Vazgeç</button><button class="primary" data-act="confirm-budget" data-finding="${c.finding}" data-proposed="${proposed}">Demo onayı ver →</button>`);}
function showRoute(route){modal('İlgili ekrana git',`<p class="modal-desc">Düğme, Madset uygulamasında aşağıdaki ekrana yönlendirir. Bu demo kendi başına üretim uygulaması değildir.</p><div class="route-box">${esc(route)}</div>${state.baseUrl?`<p class="small-muted">Kaydedilen uygulama adresi: ${esc(state.baseUrl)}</p>`:'<p class="small-muted">Gerçek uygulama adresi tanımlı değil. Aksiyon Kütüphanesi ekranından ekleyebilirsin.</p>'}`,`<button class="outline" data-act="copy-route" data-route="${esc(route)}">${icon('copy')} Rotayı kopyala</button>${state.baseUrl?`<button class="primary" data-act="open-route" data-route="${esc(route)}">Uygulamada aç ↗</button>`:''}`);}
function showFollow(c){let current=state.follows[c.finding];let tomorrow=new Date(Date.now()+86400000).toISOString().slice(0,10);modal('Yeniden kontrol tarihi seç',`<p class="modal-desc">Bu öneriyi takip listene ekle. Tarih yalnızca tarayıcıdaki prototipe kaydedilecek.</p><label class="label" for="followdate">Tekrar inceleme tarihi</label><input id="followdate" class="form-control" type="date" min="${new Date().toISOString().slice(0,10)}" value="${current||tomorrow}"/>`,`<button class="outline" data-act="close">Vazgeç</button><button class="primary" data-act="confirm-follow" data-finding="${c.finding}">${current?'Takibi güncelle':'Takibe al'}</button>`);}
function showOperational(id){let isPause=id==='pause_ad';modal(isPause?'Reklamı duraklat':'Reklamı yeniden başlat',`<p class="modal-desc">Bunlar şu anda bir finding tarafından kullanılmayan operasyon örnekleridir. Gerçek uygulama; reklam, kampanya ve reklam setinin Meta durumunu güncelleyip yeniden okumalıdır. Bu önizleme <strong>gerçek Meta readback yapmaz</strong>.</p><div class="status-lines">${Object.entries(state.statuses).map(([o,s])=>`<div class="state"><small>${o==='campaign'?'Kampanya':o==='adset'?'Reklam seti':'Reklam'}</small><strong>${esc(s)}</strong></div>`).join('')}</div>`,`<button class="outline" data-act="close">Vazgeç</button><button class="primary" data-act="confirm-operational" data-kind="${id}">Simüle et →</button>`);}
function validateBaseUrl(v){try{const u=new URL(v);return (u.protocol==='https:'||(u.protocol==='http:'&&['localhost','127.0.0.1'].includes(u.hostname)))&&!u.username&&!u.password?u.origin:''}catch(e){return ''}}
async function refreshArtifacts(){try{toast('Offline testler ve raporlar yenileniyor...');const response=await fetch('/api/refresh',{method:'POST'});const data=await response.json();if(!response.ok)throw Error(data.error||'Yenileme başarısız');toast(`${data.test_count} test geçti; offline sonuçlar ve final PDF yenilendi. Harici API çağrısı: 0.`);return true;}catch(error){toast('Rubrik kaydedildi ancak rapor yenileme başarısız: '+error.message);return false;}}
function applyEvalSource(source){if(!source)return;state.evalSource=source.id;state.evalKind=source.kind;state.evalLabel=source.label;if(source.kind==='reliability'){state.reliability=source.data;return;}if(source.kind==='single'){const d=source.data||{};const split=d.metadata?.split||'dev';const label=`${d.metadata?.model||'V3'} + Claude`;summary={summaries:{[split]:{[label]:d.summary||{}}}};state.split=split;return;}summary=source.data||INITIAL.summary;if(!summary.summaries?.[state.split])state.split=Object.keys(summary.summaries||{})[0]||'dev';}
function importEvalData(data,name){if(data?.summaries){applyEvalSource({id:'upload',label:'Yüklenen karşılaştırma · '+name,kind:'comparison',data});return true;}if(data?.summary?.runs&&Array.isArray(data.scenarios)){applyEvalSource({id:'upload',label:'Yüklenen güvenilirlik · '+name,kind:'reliability',data});return true;}if(data?.summary&&data?.metadata){applyEvalSource({id:'upload',label:'Yüklenen Claude koşusu · '+name,kind:'single',data});return true;}return false;}
async function saveScenario(){try{const payload=JSON.parse(state.scenarioDraft);const response=await fetch('/api/scenarios/dev',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok)throw Error(data.error||'Senaryo kaydedilemedi');toast(`${data.scenario} dev setine eklendi; sonuçlar yenileniyor...`);state.scenarioDraft='';await syncScenarios();await refreshArtifacts();await syncEvalResults();}catch(error){toast('Senaryo eklenmedi: '+error.message);}}
async function persistRubric(){const total=rubricTotal();if(total!==100){toast('Ağırlıkların toplamı %100 olmalı. Şu an %'+total+'.');return false;}if(state.rubric.threshold<0||state.rubric.threshold>100){toast('Geçiş eşiği 0–100 arasında olmalı.');return false;}try{const response=await fetch('/api/rubric',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state.rubric)});const data=await response.json();if(!response.ok)throw Error(data.error||'Kaydetme başarısız');state.rubric=data.rubric;state.rubricPersistence='connected';store.set('madset_ui_rubric',JSON.stringify(state.rubric));state.rubricEditing=false;render();await refreshArtifacts();return true;}catch(error){state.rubricPersistence='offline';render();toast('Dosyaya kaydedilemedi. Yerel Madset UI servisini çalıştır: python -m madset_eval.ui_server');return false;}}
async function handleAct(btn){let kind=btn.dataset.act;let c=samples.find(x=>x.finding===btn.dataset.finding);if(kind==='close'){closeModal();return;}if(kind==='budget'){showBudget(c);return;}if(kind==='navigate'){showRoute(btn.dataset.route || routeFor(c,byFinding[c.finding]));return;}if(kind==='follow'){showFollow(c);return;}
if(kind==='pause_ad'||kind==='restart_ad'){showOperational(kind);return;}
if(kind==='confirm-budget'){state.budgets[btn.dataset.finding]=Number(btn.dataset.proposed);closeModal();render();toast('Demo onayı kaydedildi. Gerçek Meta bütçesi değiştirilmedi.');return;}
if(kind==='confirm-follow'){const date=document.getElementById('followdate')?.value;if(!date||date<new Date().toISOString().slice(0,10)){toast('Geçerli bir tarih seç.');return;}state.follows[btn.dataset.finding]=date;store.set('madset_ui_follows',JSON.stringify(state.follows));closeModal();render();toast('Takip tarihi kaydedildi (yalnızca bu tarayıcıda).');return;}
if(kind==='confirm-operational'){let status=btn.dataset.kind==='pause_ad'?'PAUSED':'ACTIVE';if(status==='PAUSED')state.statuses.ad=status;else state.statuses={campaign:status,adset:status,ad:status};closeModal();toast('Durum simüle edildi. Meta API çağrısı veya readback yapılmadı.');return;}
if(kind==='save-base'){const input=document.getElementById('baseurl');let val=input.value.trim();let valid=val?validateBaseUrl(val):'';if(val&&!valid){toast('HTTPS adresi veya http://localhost gir.');return;}state.baseUrl=valid;store.set('madset_ui_base',valid);toast(valid?'Uygulama adresi kaydedildi.':'Uygulama adresi temizlendi.');render();return;}
if(kind==='copy-route'){navigator.clipboard?.writeText(btn.dataset.route).then(()=>toast('Rota kopyalandı.')).catch(()=>toast('Kopyalama izni yok. Rotayı kutudan seçebilirsin.'));return;}
if(kind==='open-route'){if(!state.baseUrl){toast('Önce uygulama adresini kaydet.');return;}let route=btn.dataset.route;if(!route.startsWith('/')||route.startsWith('//')){toast('Güvensiz rota reddedildi.');return;}window.open(state.baseUrl+route,'_blank','noopener,noreferrer');return;}
if(kind==='rubric-toggle'){state.rubricEditing=!state.rubricEditing;render();return;}
if(kind==='rubric-save'){await persistRubric();return;}
if(kind==='rubric-reset'){state.rubric=JSON.parse(JSON.stringify(RUBRIC_DEFAULT));await persistRubric();return;}
if(kind==='refresh-artifacts'){await refreshArtifacts();return;}
if(kind==='scenario-template'){state.scenarioDraft=JSON.stringify(scenarioTemplate(),null,2);render();return;}
if(kind==='scenario-save'){await saveScenario();return;}
if(kind==='rubric-export'){const payload=JSON.stringify({...state.rubric,exported_at:new Date().toISOString(),source:'Madset UI local draft'},null,2);const url=URL.createObjectURL(new Blob([payload],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`madset-rubric-${state.rubric.version}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),0);toast('Rubrik taslağı JSON olarak indirildi.');return;}
}
document.addEventListener('click',e=>{if(e.target.matches('[data-outside]')){closeModal();return;}const n=e.target.closest('[data-view]');if(n){nav(n.dataset.view);return;}const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;render();return;}const b=e.target.closest('[data-act]');if(b)handleAct(b)});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;state.search=e.target.value;render();let x=document.getElementById('search');x.focus();x.setSelectionRange(pos,pos);return;}if(e.target.id==='scenariojson'){state.scenarioDraft=e.target.value;return;}if(e.target.matches('[data-rubric-dim]')){const d=state.rubric.dimensions[Number(e.target.dataset.rubricDim)];const field=e.target.dataset.rubricField;d[field]=field==='weight'?Number(e.target.value):e.target.value;if(field==='weight'){const total=rubricTotal();const label=document.getElementById('weight-total');if(label){label.textContent='Toplam %'+total;label.classList.toggle('invalid',total!==100);}}return;}if(e.target.matches('[data-rubric-root]')){state.rubric[e.target.dataset.rubricRoot]=Number(e.target.value);}});
document.addEventListener('change',async e=>{if(e.target.matches('[data-gate]')){state.gate[e.target.dataset.gate]=e.target.checked;render();toast(e.target.checked?'Veri koşulu açıldı (demo).':'Veri koşulu kapandı: yönlendirme fallback’i aktif.');}if(e.target.id==='split'){state.split=e.target.value;render();}if(e.target.id==='evalsource'){applyEvalSource(state.evalSources.find(s=>s.id===e.target.value));render();}if(e.target.id==='jsonupload'&&e.target.files?.[0]){try{let data=JSON.parse(await e.target.files[0].text());if(!importEvalData(data,e.target.files[0].name))throw Error('unsupported eval schema');render();toast('Kayıt yalnızca görüntülemek için açıldı; senaryo veri seti değişmedi.')}catch(err){toast('Desteklenen bir eval JSON’u değil.')}}if(e.target.id==='rubricupload'&&e.target.files?.[0]){try{const data=JSON.parse(await e.target.files[0].text());if(!data||!Array.isArray(data.dimensions)||data.dimensions.length!==7||!data.dimensions.every(d=>d.id&&d.name&&Number.isFinite(Number(d.weight))))throw Error('rubric schema invalid');state.rubric={version:String(data.version||'imported-draft'),threshold:Number.isFinite(Number(data.threshold))?Number(data.threshold):80,dimensions:data.dimensions.map(d=>({id:String(d.id),name:String(d.name),weight:Number(d.weight),zero:String(d.zero||''),two:String(d.two||''),four:String(d.four||'')}))};state.rubricEditing=false;render();toast('Rubrik JSON taslağı açıldı. Kaydetmek için Düzenle → Dosyalara kaydet kullan.')}catch(err){toast('Bu dosya Madset rubrik JSON biçiminde değil.')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function syncRubricFromServer(){try{const response=await fetch('/api/rubric',{cache:'no-store'});if(!response.ok)throw Error('rubric unavailable');const data=await response.json();state.rubric=data.rubric;state.rubricPersistence='connected';store.set('madset_ui_rubric',JSON.stringify(state.rubric));}catch(error){state.rubricPersistence='offline';}if(state.view==='rubric')render();}
async function syncEvalResults(){try{const response=await fetch('/api/eval-results',{cache:'no-store'});if(!response.ok)throw Error('eval unavailable');const data=await response.json();state.evalSources=data.sources||[];applyEvalSource(state.evalSources.find(s=>s.id===state.evalSource)||state.evalSources[0]);}catch(error){}if(state.view==='eval')render();}
async function syncScenarios(){try{const response=await fetch('/api/scenarios',{cache:'no-store'});if(!response.ok)throw Error('scenarios unavailable');state.scenarios=await response.json();}catch(error){}if(state.view==='scenarios')render();}
async function syncIntegration(){try{const response=await fetch('/api/integration-status',{cache:'no-store'});if(response.ok)state.integration=await response.json();}catch(error){}if(state.view==='workflow')render();}
for(let el of document.querySelectorAll('[data-icon]'))el.innerHTML=icon(el.dataset.icon);
render();syncRubricFromServer();syncEvalResults();syncScenarios();syncIntegration();
</script>
</body></html>
